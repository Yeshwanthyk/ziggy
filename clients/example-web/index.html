<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f13" />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="Ziggy is a local-first conversation desk for Profiles, specialists, and routines."
    />
    <title>Ziggy — signal desk</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell" id="app" data-view="chat" data-mode="demo">
      <div class="mobile-backdrop" id="mobile-backdrop" hidden></div>

      <aside class="sidebar" id="sidebar" aria-label="Ziggy navigation">
        <div class="sidebar-top">
          <a class="wordmark" href="#chat" aria-label="Ziggy home">
            <span class="wordmark-mark" aria-hidden="true">z</span>
            <span>Ziggy</span>
          </a>
          <div class="sidebar-top-actions">
            <button class="icon-button sidebar-new" type="button" data-action="new-conversation" aria-label="New conversation" title="New conversation">
              <span aria-hidden="true">＋</span>
            </button>
            <button class="icon-button sidebar-close" id="close-rail" type="button" aria-label="Close navigation" title="Close navigation">
              <span aria-hidden="true">×</span>
            </button>
          </div>
        </div>

        <div class="profile-switcher">
          <div class="profile-identity">
            <span class="avatar avatar-small" id="profile-avatar" data-avatar="squarey" aria-hidden="true"></span>
            <span class="profile-copy">
              <span class="eyebrow">Profile</span>
              <strong id="profile-name">Squarey</strong>
            </span>
          </div>
          <span class="presence-dot presence-ready" id="profile-presence" aria-label="Profile resident ready"></span>
        </div>

        <nav class="primary-nav" aria-label="Primary">
          <button class="nav-item is-active" type="button" data-view="chat" aria-current="page">
            <span class="nav-icon" aria-hidden="true">◌</span>
            <span>Conversations</span>
            <span class="nav-count" id="conversation-count">5</span>
          </button>
          <button class="nav-item" type="button" data-view="agents">
            <span class="nav-icon" aria-hidden="true">✦</span>
            <span>Agents</span>
          </button>
          <button class="nav-item" type="button" data-view="automations">
            <span class="nav-icon" aria-hidden="true">↻</span>
            <span>Automations</span>
            <span class="nav-count nav-count-alert" id="automation-count">3</span>
          </button>
          <button class="nav-item" type="button" data-view="memory">
            <span class="nav-icon" aria-hidden="true">▱</span>
            <span>Memory &amp; extensions</span>
          </button>
        </nav>

        <div class="roster-tools">
          <label class="search-field" for="conversation-search">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <span class="sr-only">Search conversations</span>
            <input id="conversation-search" type="search" placeholder="Search conversations" autocomplete="off" />
            <kbd>/</kbd>
          </label>
          <button class="new-conversation" type="button" data-action="new-conversation">
            <span aria-hidden="true">＋</span>
            <span>New conversation</span>
            <kbd>N</kbd>
          </button>
        </div>

        <div class="roster" id="roster" aria-label="Conversation roster">
          <section class="roster-section" aria-labelledby="pinned-heading">
            <div class="roster-heading">
              <h2 id="pinned-heading">Pinned</h2>
              <span class="roster-rule" aria-hidden="true"></span>
            </div>
            <div class="roster-list" id="pinned-list"></div>
          </section>
          <section class="roster-section" aria-labelledby="recent-heading">
            <div class="roster-heading">
              <h2 id="recent-heading">Recent</h2>
              <span class="roster-rule" aria-hidden="true"></span>
            </div>
            <div class="roster-list" id="recent-list"></div>
          </section>
          <section class="roster-section" aria-labelledby="specialists-heading">
            <div class="roster-heading">
              <h2 id="specialists-heading">Specialists</h2>
              <span class="roster-rule" aria-hidden="true"></span>
            </div>
            <div class="roster-list" id="specialists-list"></div>
          </section>
        </div>

        <div class="sidebar-footer">
          <div class="resident-status" id="resident-status">
            <span class="status-led" aria-hidden="true"></span>
            <span>
              <strong>Local resident</strong>
              <small id="resident-caption">Connected to Squarey</small>
            </span>
          </div>
          <button class="footer-action" type="button" data-action="open-connection">
            <span aria-hidden="true">⇄</span>
            <span>Connection</span>
          </button>
        </div>
      </aside>

      <main class="main-stage" id="main-stage">
        <header class="topbar">
          <div class="topbar-start">
            <button class="icon-button mobile-only" id="open-rail" type="button" aria-label="Open navigation" title="Open navigation">
              <span aria-hidden="true">☰</span>
            </button>
            <span class="topbar-context sr-only" id="topbar-context">Conversations</span>
          </div>
          <div class="topbar-actions">
            <button class="connection-chip" id="connection-chip" type="button" data-action="open-connection">
              <span class="status-led" aria-hidden="true"></span>
              <span id="connection-label">Ready</span>
            </button>
            <button class="icon-button" id="open-details" type="button" aria-label="Open conversation details" title="Conversation details">
              <span aria-hidden="true">⋯</span>
            </button>
          </div>
        </header>

        <div class="dev-state" hidden>
          <label for="demo-state">Fixture state</label>
          <select id="demo-state" aria-label="Choose a fixture state">
            <option value="ready">Ready</option>
            <option value="loading">Loading</option>
            <option value="busy">Busy</option>
            <option value="stopping">Stopping</option>
            <option value="watch-only">Watch only</option>
            <option value="reconnecting">Reconnecting</option>
            <option value="offline">Offline</option>
            <option value="empty">Empty</option>
            <option value="validation">Validation</option>
            <option value="request">Request pending</option>
            <option value="ownership">Ownership</option>
            <option value="reconciliation">Reconciliation</option>
          </select>
        </div>

        <section class="view-root" id="view-root" aria-live="off"></section>
      </main>

      <aside class="details-panel" id="details-panel" aria-label="Conversation details" aria-hidden="true">
        <div class="details-header">
          <div>
            <span class="eyebrow">Context</span>
            <h2>Conversation details</h2>
          </div>
          <button class="icon-button" id="close-details" type="button" aria-label="Close conversation details" title="Close details">
            <span aria-hidden="true">×</span>
          </button>
        </div>
        <div class="details-body" id="details-body"></div>
      </aside>

      <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
      <div class="live-region" id="live-region" aria-live="polite" aria-atomic="true"></div>
    </div>

    <dialog class="connection-dialog" id="connection-dialog" aria-labelledby="connection-dialog-title">
      <form method="dialog" class="dialog-card" id="connection-form">
        <div class="dialog-heading">
          <div>
            <span class="eyebrow">Gateway</span>
            <h2 id="connection-dialog-title">Connect a resident</h2>
          </div>
          <button class="icon-button" value="cancel" type="submit" aria-label="Close connection dialog" title="Close dialog">
            <span aria-hidden="true">×</span>
          </button>
        </div>
        <p class="dialog-copy">Connect this tab to a local Ziggy resident. Credentials stay in this tab and are never bundled with the example.</p>
        <label class="field-label" for="gateway-url">WebSocket endpoint</label>
        <input id="gateway-url" name="url" inputmode="url" placeholder="ws://127.0.0.1:8787/ws" autocomplete="url" />
        <label class="field-label" for="gateway-token">Session token</label>
        <input id="gateway-token" name="token" type="password" placeholder="Paste a runtime token" autocomplete="off" />
        <p class="field-error" id="connection-error" role="alert"></p>
        <div class="dialog-actions">
          <button class="button-secondary" value="cancel" type="submit">Cancel</button>
          <button class="button-primary" id="connect-gateway" value="default" type="submit">Connect</button>
        </div>
      </form>
    </dialog>

    <script src="./dist/main.js"></script>
  </body>
</html>
