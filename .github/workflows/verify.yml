name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: S0 verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Verify Effect vendor pin and documentation
        shell: bash
        run: |
          set -euo pipefail
          expected=6184a7dc53cb9310e299b65ad6d6c712c2cbf202
          actual="$(git -C vendor/effect rev-parse HEAD)"
          test "$actual" = "$expected"
          test -d vendor/effect/ai-docs/src
          test -r vendor/effect/ai-docs/src
          test -d vendor/effect/migration
          test -r vendor/effect/migration

      - name: Set up Bun 1.3.13
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run fmt:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Run cumulative verification
        if: ${{ !cancelled() }}
        run: bun run verify:all

      - name: Upload verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/verification
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
