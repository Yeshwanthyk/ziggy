name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  darwin-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build:binary
      - name: Package darwin-arm64 assets
        run: |
          mkdir -p dist/release
          cp dist/ziggy dist/release/ziggy-darwin-arm64
          chmod 755 dist/release/ziggy-darwin-arm64
          codesign -s - --force dist/release/ziggy-darwin-arm64
          shasum -a 256 dist/release/ziggy-darwin-arm64 | awk '{print $1}' > dist/release/ziggy-darwin-arm64.sha256
          cp scripts/install.sh dist/release/install.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/ziggy-darwin-arm64
            dist/release/ziggy-darwin-arm64.sha256
            dist/release/install.sh
          fail_on_unmatched_files: true
          generate_release_notes: true
